name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, unit, security and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (fatal on errors and warnings)
        shell: bash
        run: |
          rc=0
          flutter analyze --fatal-warnings > analyze.txt 2>&1 || rc=$?
          cat analyze.txt
          python3 .github/scripts/annotate_output.py analyze.txt
          exit $rc

      - name: Unit, security and regression tests with coverage
        shell: bash
        run: |
          rc=0
          flutter test test/ --coverage --reporter expanded > unit.txt 2>&1 || rc=$?
          cat unit.txt
          python3 .github/scripts/annotate_output.py unit.txt
          exit $rc

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  js-sdk-tests:
    name: Injected JavaScript SDK (Node VM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SDK tests against the shipped template
        run: node --test test/js/bridge_sdk.test.mjs

  android-build:
    name: Android build (debug and release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          rc=0
          flutter build apk --debug > debug-build.txt 2>&1 || rc=$?
          cat debug-build.txt
          python3 .github/scripts/annotate_output.py debug-build.txt
          exit $rc

      - name: "Build release APK (unsigned: no release keystore in CI)"
        shell: bash
        run: |
          rc=0
          flutter build apk --release > release-build.txt 2>&1 || rc=$?
          cat release-build.txt
          python3 .github/scripts/annotate_output.py release-build.txt
          exit $rc

  android-e2e:
    name: Android end-to-end (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            rc=0
            flutter test integration_test/app_test.dart > e2e.txt 2>&1 || rc=$?
            cat e2e.txt
            python3 .github/scripts/annotate_output.py e2e.txt
            exit $rc
