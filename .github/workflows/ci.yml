name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, unit, security and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (fatal on errors and warnings)
        shell: bash
        run: |
          rc=0
          flutter analyze --fatal-warnings > analyze.txt 2>&1 || rc=$?
          cat analyze.txt
          python3 .github/scripts/annotate_output.py analyze.txt
          exit $rc

      - name: Unit, security and regression tests with coverage
        shell: bash
        run: |
          rc=0
          flutter test test/ --coverage --reporter expanded > unit.txt 2>&1 || rc=$?
          cat unit.txt
          python3 .github/scripts/annotate_output.py unit.txt
          exit $rc

      - name: Coverage gate
        run: python3 .github/scripts/coverage_gate.py coverage/lcov.info ${{ vars.COVERAGE_MIN || '0' }} '(^|/)(gen|generated)/|\.g\.dart$'

      - name: Format check (dart format, fails on any unformatted file)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/format_report.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  js-sdk-tests:
    name: Injected JavaScript SDK (Node VM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SDK tests against the shipped template
        run: node --test test/js/bridge_sdk.test.mjs

  android-build:
    name: Android build (debug and release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          rc=0
          flutter build apk --debug > debug-build.txt 2>&1 || rc=$?
          cat debug-build.txt
          python3 .github/scripts/annotate_output.py debug-build.txt
          exit $rc

      - name: "Build release APK (unsigned: no release keystore in CI)"
        shell: bash
        run: |
          rc=0
          flutter build apk --release > release-build.txt 2>&1 || rc=$?
          cat release-build.txt
          python3 .github/scripts/annotate_output.py release-build.txt
          exit $rc

  android-e2e:
    name: Android end-to-end (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Inspect and prepare Android SDK (NDK)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/ndk" 2>&1 || echo "no ndk dir under ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/ndk" 2>&1 || echo "no ndk dir under ANDROID_HOME"
          SDKM="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "ndk;28.2.13676358" > ndk-install.txt 2>&1 || true
            tail -5 ndk-install.txt
          fi

      - name: Pre-build debug APK outside the emulator run
        shell: bash
        run: |
          rc=0
          flutter build apk --debug > e2e-prebuild.txt 2>&1 || rc=$?
          cat e2e-prebuild.txt | tail -60
          python3 .github/scripts/annotate_output.py e2e-prebuild.txt 40
          exit $rc

      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash .github/scripts/run_e2e.sh

      - name: Collect E2E diagnostics
        if: always()
        shell: bash
        run: |
          for f in e2e.txt e2e.rc e2e-proc.log; do
            if [ -f "$f" ]; then echo "== $f"; tail -80 "$f"; fi
          done
          [ -f e2e-proc.log ] && python3 .github/scripts/annotate_output.py e2e-proc.log 30 || true
          [ -f e2e.rc ] && echo "::notice::e2e exit code file: $(cat e2e.rc)" || echo "::error::e2e.rc was not written"
          [ -f e2e.txt ] && python3 .github/scripts/annotate_output.py e2e.txt 60 || true

  ios-build:
    name: iOS build (macOS, no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check committed iOS project files
        shell: bash
        run: |
          if [ ! -f ios/Podfile ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "::error::ios/Podfile or Runner.xcodeproj is missing"
            exit 1
          fi
          echo "::notice::iOS project files present"

      - name: Enable permission_handler iOS permission macros
        run: python3 .github/scripts/ios_permissions.py ios/Podfile

      - name: Build iOS app without codesigning
        shell: bash
        run: |
          rc=0
          flutter build ios --debug --no-codesign > ios-build.txt 2>&1 || rc=$?
          if [ "$rc" != "0" ]; then
            grep -n -i "error" ios-build.txt | head -40 | sed 's/^/::error::/'
            tail -n 80 ios-build.txt | sed 's/^/::notice::/'
          fi
          exit $rc
