name: sweetmelon
description: Flutter Native Bridge - JS to Native communication platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Core
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.9.0
  uuid: ^4.2.1
  get_it: ^7.6.4
  http: ^1.1.2
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  permission_handler: ^11.3.1
  mime: ^1.0.5
  crypto: ^3.0.5

  # Connectivity & Device
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  app_links: ^6.3.2
  share_plus: ^10.0.2
  cross_file: ^0.3.4+2

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.4

  # Media
  local_auth: ^2.3.0
  mobile_scanner: ^7.0.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  sms_autofill: ^2.4.0
  sqflite: ^2.3.3+2
  flutter_contacts: ^1.1.9+2
  image_gallery_saver_plus: ^5.0.0
  flutter_image_compress: ^2.4.0
  archive: ^3.6.1
  file_picker: ^8.0.0+1
  in_app_review: ^2.0.9
  sensors_plus: ^5.0.1
  screen_brightness: ^2.1.11
  torch_light: ^1.0.0
  pedometer: ^4.0.1
  flutter_app_badger_plus: ^1.0.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  video_player: ^2.9.2
  flutter_inappwebview: ^6.1.5
  pdf: ^3.11.1
  printing: ^5.13.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  device_calendar: ^4.3.2
  flutter_blue_plus: ^1.32.12
  nfc_manager: ^3.5.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  camera: ^0.11.0+2
  cunning_document_scanner: ^1.2.2
  in_app_purchase: ^3.2.0
  dartssh2: ^2.8.2

  # CLI tools (bin/)
  yaml: ^3.1.2
  args: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # برای تست مسیر فعالِ پلاگین‌های Firebase: mockهای رسمی هسته و جایگزینی
  # platform double برای کانال آنالیتیکس.
  firebase_core_platform_interface: ^6.0.0
  firebase_analytics_platform_interface: ^4.4.3


flutter:
  uses-material-design: true
  assets:
    - assets/www/
