name: sweetmelon
description: Flutter Native Bridge - JS to Native communication platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.4.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.2.1
  get_it: ^7.6.4
  http: ^1.1.2

  core:
    path: packages/core
  devtools:
    path: packages/devtools
  performance:
    path: packages/performance
  plugin_engine:
    path: packages/plugin_engine
  security:
    path: packages/security
  camera_plugin:
    path: plugins/camera
  geolocation_plugin:
    path: plugins/geolocation
  storage_plugin:
    path: plugins/storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true