# Sweetmelon Plugin Configuration
# هر پلاگین که true باشه فعال و register می‌شه
# هر پلاگین که false باشه:
#   - از service_locator حذف می‌شه
#   - dependency‌اش از pubspec حذف می‌شه
#   - permission‌هاش از manifest حذف می‌شه
#   - از native-sdk.js حذف می‌شه

project:
  name: sweetmelon
  version: 1.0.0
  min_sdk: "3.0.0"

  # مسیر پروژه HTML (ثابت)
  www_path: assets/www
  entry_point: index.html

plugins:
  # ── فاز ۱: پایه ──
  permission:
    enabled: true

  app_lifecycle:
    enabled: true

  device_info:
    enabled: true

  connectivity:
    enabled: true

  storage:
    enabled: true

  file_system:
    enabled: true

  http_native:
    enabled: true

  intent_link:
    enabled: true

  clipboard:
    enabled: true

  share:
    enabled: true

  camera:
    enabled: true

  geolocation:
    enabled: true

  # ── فاز ۳: پیشرفته ──
  back_button:
    enabled: true

  secure_storage:
    enabled: true

  notification:
    enabled: true

  status_bar:
    enabled: true

  orientation:
    enabled: true

  haptic:
    enabled: true

  keyboard:
    enabled: true

  # ── فاز ۴: تخصصی ──
  biometrics:
    enabled: false

  qr_scanner:
    enabled: false

  audio:
    enabled: false

  sms_otp:
    enabled: false

  download_manager:
    enabled: true

  database:
    enabled: true

  contacts:
    enabled: false

  phone_dialer:
    enabled: true

  # ── فاز ۵: پیشرفته ──
  bluetooth:
    enabled: false

  nfc:
    enabled: false

  speech_to_text:
    enabled: false

  text_to_speech:
    enabled: false

  video_player:
    enabled: false

  in_app_browser:
    enabled: true

  pdf:
    enabled: false

  encryption:
    enabled: true
